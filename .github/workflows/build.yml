name: Makosizer CI

on:
  push:
    branches:
      - main
      - "copilot/**"
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows VST3
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Makosizer_VST3

      - uses: actions/upload-artifact@v4
        with:
          name: Makosizer-Windows-VST3
          path: build/Makosizer_artefacts/Release/VST3/Makosizer.vst3
          if-no-files-found: error

  macos-universal:
    name: macOS Universal VST3 + AU
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Universal Binary
        run: |
          set -euo pipefail
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build macOS VST3
        run: cmake --build build --config Release --target Makosizer_VST3

      - name: Build macOS AU
        run: cmake --build build --config Release --target Makosizer_AU

      - name: Verify and package macOS plugin bundles
        run: |
          set -euo pipefail
          VST3="build/Makosizer_artefacts/Release/VST3/Makosizer.vst3"
          AU="build/Makosizer_artefacts/Release/AU/Makosizer.component"
          test -d "$VST3"
          test -d "$AU"
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "$VST3" package/Makosizer-macOS-Universal.vst3.zip
          ditto -c -k --sequesterRsrc --keepParent "$AU" package/Makosizer-macOS-Universal.component.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Makosizer-macOS-Universal-VST3
          path: package/Makosizer-macOS-Universal.vst3.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Makosizer-macOS-Universal-AU
          path: package/Makosizer-macOS-Universal.component.zip
          if-no-files-found: error
